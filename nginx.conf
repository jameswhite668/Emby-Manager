# Nginx配置 - 支持6000并发用户
# 将此配置复制到 /etc/nginx/nginx.conf (Linux) 或 nginx安装目录/conf/nginx.conf (Windows)

worker_processes auto;  # 自动根据CPU核心数设置
worker_rlimit_nofile 65535;  # 最大打开文件数

events {
    worker_connections 4096;  # 每个工作进程的最大连接数
    use epoll;  # Linux高性能事件模型
    multi_accept on;  # 允许同时接受多个连接
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log logs/access.log main;
    error_log logs/error.log warn;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    
    # 限制请求速率（防止DDoS）
    limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # 上游服务器组（负载均衡）
    upstream emby_manager {
        # 权重轮询
        server 127.0.0.1:5001 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5002 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5003 weight=5 max_fails=3 fail_timeout=30s;
        
        # 健康检查
        keepalive 32;
    }
    
    # HTTP服务器
    server {
        listen 80;
        server_name localhost;
        
        # 限制请求速率
        limit_req zone=one burst=200 nodelay;
        limit_conn addr 50;
        
        # 客户端文件大小限制
        client_max_body_size 100M;
        client_body_buffer_size 128k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 4k;
        
        # 超时设置
        client_body_timeout 60s;
        client_header_timeout 60s;
        send_timeout 60s;
        
        # 静态文件缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            access_log off;
        }
        
        # 静态文件目录
        location /static/ {
            alias static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # 反向代理到应用服务器
        location / {
            proxy_pass http://emby_manager;
            proxy_http_version 1.1;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # 代理超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲区设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 错误处理
            proxy_intercept_errors on;
            error_page 500 502 503 504 /50x.html;
        }
        
        # 错误页面
        location = /50x.html {
            root html;
            internal;
        }
    }
    
    # HTTPS服务器（推荐生产环境使用）
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     # SSL证书配置
    #     ssl_certificate /path/to/cert.pem;
    #     ssl_certificate_key /path/to/key.pem;
    #     
    #     # SSL优化
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # 其他配置与HTTP相同...
    # }
}
